name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela la ejecución anterior de la misma rama cuando llega un commit nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Tipos y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El cliente de Prisma genera los tipos que usa el código. No se conecta a ninguna base.
      - name: Generar el cliente de Prisma
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Revisar tipos
        run: pnpm exec tsc --noEmit

      - name: Pruebas unitarias
        run: pnpm test
